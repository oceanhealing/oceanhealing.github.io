
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A reflection from Ocean — a space for healing, consciousness, and becoming.">
  <title>Reflection | Ocean</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ocean.css">

  <style>
    .reflection-hero {
      background: #193b3b;
      color: #f4efe6;
      padding: 190px 7vw 85px;
      text-align: center;
    }

    .reflection-hero .eyebrow {
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .75;
    }

    .reflection-hero h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(42px, 7vw, 68px);
      font-weight: 400;
      line-height: 1.1;
      max-width: 850px;
      margin: 20px auto;
    }

    .reflection-meta {
      font-size: 12px;
      letter-spacing: .08em;
      opacity: .75;
    }

    .reflection-main {
      background: #f4efe6;
      color: #193b3b;
      padding: 75px 24px 110px;
    }

    .reflection-article {
      max-width: 760px;
      margin: 0 auto;
    }

    .reflection-image {
      display: block;
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      margin: 0 auto 55px;
    }

    .reflection-content {
      font-family: "Inter", sans-serif;
      font-size: 16px;
      font-weight: 300;
      line-height: 1.95;
    }

    .reflection-content h2,
    .reflection-content h3 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
      line-height: 1.25;
      margin: 48px 0 18px;
    }

    .reflection-content h2 { font-size: 36px; }
    .reflection-content h3 { font-size: 28px; }

    .reflection-content p { margin: 0 0 25px; }

    .reflection-content blockquote {
      border-left: 2px solid #a6b2a5;
      margin: 35px 0;
      padding: 5px 0 5px 25px;
      color: #526a62;
      font-family: "Cormorant Garamond", serif;
      font-size: 25px;
    }

    .reflection-content ul,
    .reflection-content ol {
      padding-left: 28px;
      margin: 20px 0 30px;
    }

    .reflection-content li { margin-bottom: 10px; }

    .reflection-content a {
      color: #526a62;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .reflection-content hr {
      border: 0;
      border-top: 1px solid #d8d2c7;
      margin: 45px 0;
    }

    .reflection-topics {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 45px;
    }

    .reflection-topics a,
    .reflection-back a {
      display: inline-block;
      color: #526a62;
      border: 1px solid #a6b2a5;
      padding: 10px 17px;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: .06em;
      transition: background .2s ease;
    }

    .reflection-topics a:hover,
    .reflection-back a:hover {
      background: #e5e8df;
    }

    .reflection-back {
      text-align: center;
      margin-top: 65px;
    }

    .reflection-message {
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 0;
    }

    .reflection-message h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: 34px;
      font-weight: 400;
    }

    .reflection-message p { line-height: 1.8; }

    @media (max-width: 700px) {
      .reflection-hero { padding: 155px 24px 65px; }
      .reflection-main { padding: 50px 22px 75px; }
      .reflection-content { font-size: 15px; }
      .reflection-image { margin-bottom: 35px; }
    }
  </style>
</head>

<body>
  <header class="nav">
    <a class="brand" href="index.html">OCEAN</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="healing.html">Healing</a>
      <a href="consciousness.html">Consciousness</a>
    </nav>
  </header>

  <main>
    <section class="reflection-hero">
      <p class="eyebrow">A reflection from Ocean</p>
      <h1 id="reflection-title">A moment of reflection</h1>
      <p class="reflection-meta" id="reflection-date"></p>
    </section>

    <section class="reflection-main">
      <article class="reflection-article">
        <img
          id="reflection-image"
          class="reflection-image"
          alt=""
          hidden
        >

        <div id="reflection-content" class="reflection-content">
          <div class="reflection-message">
            <h2>Opening the space...</h2>
            <p>Taking a moment to bring this reflection to you.</p>
          </div>
        </div>

        <div id="reflection-topics" class="reflection-topics"></div>

        <div class="reflection-back">
          <a href="healing.html">Explore Healing</a>
          <a href="consciousness.html">Explore Consciousness</a>
        </div>
      </article>
    </section>
  </main>

  <footer>
    <p>OCEAN</p>
    <p>A space for healing, presence, and becoming.</p>
  </footer>

  <script>
    const titleElement = document.getElementById("reflection-title");
    const dateElement = document.getElementById("reflection-date");
    const imageElement = document.getElementById("reflection-image");
    const contentElement = document.getElementById("reflection-content");
    const topicsElement = document.getElementById("reflection-topics");

    function showMessage(title, message) {
      contentElement.replaceChildren();

      const wrapper = document.createElement("div");
      wrapper.className = "reflection-message";

      const heading = document.createElement("h2");
      heading.textContent = title;

      const paragraph = document.createElement("p");
      paragraph.textContent = message;

      wrapper.append(heading, paragraph);
      contentElement.append(wrapper);
    }

    function parseFrontMatter(markdown) {
      const match = markdown.match(/^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?/);

      if (!match) {
        return { metadata: {}, body: markdown };
      }

      const metadata = {};

      match[1].split(/\r?\n/).forEach(line => {
        const separator = line.indexOf(":");
        if (separator === -1) return;

        const key = line.slice(0, separator).trim();
        let value = line.slice(separator + 1).trim();

        if (value.startsWith("[") && value.endsWith("]")) {
          value = value.slice(1, -1)
            .split(",")
            .map(item => item.trim().replace(/^["']|["']$/g, ""));
        } else {
          value = value.replace(/^["']|["']$/g, "");
        }

        metadata[key] = value;
      });

      return {
        metadata,
        body: markdown.slice(match[0].length)
      };
    }

    function appendInline(parent, text) {
      const pattern = /(\[([^\]]+)\]\(([^)]+)\)|\*\*([^*]+)\*\*|\*([^*]+)\*|`([^`]+)`)/g;
      let lastIndex = 0;
      let match;

      while ((match = pattern.exec(text)) !== null) {
        parent.append(document.createTextNode(text.slice(lastIndex, match.index)));

        if (match[2] && match[3]) {
          const link = document.createElement("a");
          const href = match[3].trim();

          if (/^(https?:\/\/|mailto:|\/|\.\/|\.\.\/|#)/i.test(href)) {
            link.href = href;
            link.textContent = match[2];
            if (/^https?:\/\//i.test(href)) {
              link.target = "_blank";
              link.rel = "noopener noreferrer";
            }
            parent.append(link);
          } else {
            parent.append(document.createTextNode(match[2]));
          }
        } else if (match[4]) {
          const strong = document.createElement("strong");
          strong.textContent = match[4];
          parent.append(strong);
        } else if (match[5]) {
          const emphasis = document.createElement("em");
          emphasis.textContent = match[5];
          parent.append(emphasis);
        } else if (match[6]) {
          const code = document.createElement("code");
          code.textContent = match[6];
          parent.append(code);
        }

        lastIndex = pattern.lastIndex;
      }

      parent.append(document.createTextNode(text.slice(lastIndex)));
    }

    function renderMarkdown(markdown) {
      contentElement.replaceChildren();

      const lines = markdown.replace(/\r/g, "").split("\n");
      let i = 0;

      while (i < lines.length) {
        const line = lines[i].trim();

        if (!line) {
          i++;
          continue;
        }

        if (/^```/.test(line)) {
          i++;
          const codeLines = [];

          while (i < lines.length && !/^```/.test(lines[i].trim())) {
            codeLines.push(lines[i]);
            i++;
          }

          const pre = document.createElement("pre");
          const code = document.createElement("code");
          code.textContent = codeLines.join("\n");
          pre.append(code);
          contentElement.append(pre);
          i++;
          continue;
        }

        if (/^---+$/.test(line) || /^\*\*\*+$/.test(line)) {
          contentElement.append(document.createElement("hr"));
          i++;
          continue;
        }

        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          const element = document.createElement(
            "h" + Math.min(heading[1].length + 1, 3)
          );
          appendInline(element, heading[2]);
          contentElement.append(element);
          i++;
          continue;
        }

        if (line.startsWith(">")) {
          const quote = document.createElement("blockquote");
          while (i < lines.length && lines[i].trim().startsWith(">")) {
            const paragraph = document.createElement("p");
            appendInline(paragraph, lines[i].trim().replace(/^>\s?/, ""));
            quote.append(paragraph);
            i++;
          }
          contentElement.append(quote);
          continue;
        }

        if (/^[-*+]\s+/.test(line) || /^\d+\.\s+/.test(line)) {
          const ordered = /^\d+\.\s+/.test(line);
          const list = document.createElement(ordered ? "ol" : "ul");

          while (i < lines.length &&
            (/^[-*+]\s+/.test(lines[i].trim()) ||
             /^\d+\.\s+/.test(lines[i].trim()))) {
            const item = document.createElement("li");
            appendInline(item, lines[i].trim().replace(/^([-*+]\s+|\d+\.\s+)/, ""));
            list.append(item);
            i++;
          }

          contentElement.append(list);
          continue;
        }

        const paragraphLines = [];

        while (i < lines.length && lines[i].trim() &&
          !/^(#{1,3}\s|>|[-*+]\s|\d+\.\s|---+$|\*\*\*+$|```)/.test(lines[i].trim())) {
          paragraphLines.push(lines[i].trim());
          i++;
        }

        if (paragraphLines.length) {
          const paragraph = document.createElement("p");
          appendInline(paragraph, paragraphLines.join(" "));
          contentElement.append(paragraph);
        }
      }
    }

    async function loadReflection() {
      const params = new URLSearchParams(window.location.search);
      const filename = params.get("file");

      if (!filename || !/^[a-z0-9-]+\.md$/i.test(filename)) {
        titleElement.textContent = "Reflection";
        showMessage(
          "No reflection selected",
          "Please return to the Healing or Consciousness page and choose a reflection."
        );
        return;
      }

      try {
        const response = await fetch("reflections/" + filename);

        if (!response.ok) {
          throw new Error("Reflection not found");
        }

        const markdown = await response.text();
        const { metadata, body } = parseFrontMatter(markdown);

        const title = metadata.title || "A reflection from Ocean";
        titleElement.textContent = title;
        document.title = title + " | Ocean";

        if (metadata.date) {
          dateElement.textContent = metadata.date;
        }

        if (metadata.image &&
            /^(https?:\/\/|\/|\.\/|\.\.\/)/i.test(metadata.image)) {
          imageElement.src = metadata.image;
          imageElement.alt = title;
          imageElement.hidden = false;
        }

        renderMarkdown(body);

        const topics = Array.isArray(metadata.topics)
          ? metadata.topics
          : (metadata.topics ? [metadata.topics] : []);

        topics.forEach(topic => {
          const normalized = String(topic).toLowerCase().trim();

          const destinations = {
            healing: "healing.html",
            consciousness: "consciousness.html"
          };

          if (!destinations[normalized]) return;

          const link = document.createElement("a");
          link.href = destinations[normalized];
          link.textContent = normalized === "healing"
            ? "Healing"
            : "Consciousness";

          topicsElement.append(link);
        });

      } catch (error) {
        console.error(error);
        titleElement.textContent = "Reflection";
        showMessage(
          "This reflection is not available yet",
          "The writing may still be finding its way here. Please return to the Ocean journal and try again."
        );
      }
    }

    loadReflection();
  </script>
</body>
</html>
